name: Deploy to App Runner

on:
  push:
    branches: [main]
    paths:
      - 'github-actions-apprunner/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: github-actions-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd github-actions-apprunner
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        run: |
          if aws apprunner describe-service --service-arn arn:aws:apprunner:ap-southeast-2:013709423315:service/github-actions-service 2>/dev/null; then
            echo "Triggering App Runner deployment..."
            aws apprunner start-deployment --service-arn arn:aws:apprunner:ap-southeast-2:013709423315:service/github-actions-service
          else
            echo "App Runner service not found - create it manually first"
          fi
