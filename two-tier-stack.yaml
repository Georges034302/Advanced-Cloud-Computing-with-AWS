AWSTemplateFormatVersion: '2010-09-09'
Description: 'Two-Tier VPC with Web and Backend API'

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: CF-VPC

  # Internet Gateway
  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: CF-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref IGW

  # Public Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: Public-Subnet

  # Private Subnet
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: Private-Subnet

  # Public Route Table
  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public-RT

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRT
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  PublicSubnetRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRT

  # NAT Gateway (allows private subnet internet access)
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: NAT-Gateway

  # Private Route Table
  PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Private-RT

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRT
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRT

  # Security Group - Load Balancer
  LBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP to Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: LB-SG

  # Security Group - Web Tier
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from LB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LBSG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Web-SG

  # Security Group - Backend Tier
  BackendSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from Web tier only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref WebSG
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Backend-SG

  # Backend API Instance
  BackendInstance:
    Type: AWS::EC2::Instance
    DependsOn: NatGateway
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref BackendSG
      Tags:
        - Key: Name
          Value: Backend-API
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3 python3-pip
          
          cat > /home/ec2-user/app.py <<'PYEOF'
          from flask import Flask, jsonify
          app = Flask(__name__)

          @app.route('/')
          def home():
              return jsonify({"message": "Backend API", "status": "running"})

          @app.route('/joke')
          def joke():
              return jsonify({"joke": "Why do programmers prefer dark mode? Because light attracts bugs!"})

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000)
          PYEOF
          
          pip3 install flask
          nohup python3 /home/ec2-user/app.py &

  # Web Server Instance
  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn: BackendInstance
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSG
      Tags:
        - Key: Name
          Value: Web-Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          
          cat > /var/www/html/index.html <<HTMLEOF
          <!DOCTYPE html>
          <html>
          <head><title>CloudFormation Two-Tier App</title></head>
          <body style="font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px;">
              <h1>CloudFormation Two-Tier Architecture</h1>
              <p><strong>Web Tier:</strong> This server (public subnet)</p>
              <p><strong>Backend Tier:</strong> API at ${BackendInstance.PrivateIp}:5000 (private subnet)</p>
              <p><strong>NAT Gateway:</strong> Enables private subnet internet access</p>
              <hr>
              <h3>Test Backend API:</h3>
              <button onclick="fetch('/api/').then(r=>r.json()).then(d=>document.getElementById('r').innerText=JSON.stringify(d,null,2))">Get Status</button>
              <button onclick="fetch('/api/joke').then(r=>r.json()).then(d=>document.getElementById('r').innerText=JSON.stringify(d,null,2))">Get Joke</button>
              <pre id="r" style="background: #f4f4f4; padding: 15px; margin-top: 20px; border-radius: 5px;"></pre>
          </body>
          </html>
          HTMLEOF
          
          cat > /etc/httpd/conf.d/proxy.conf <<PROXYEOF
          LoadModule proxy_module modules/mod_proxy.so
          LoadModule proxy_http_module modules/mod_proxy_http.so
          <Location /api>
              ProxyPass http://${BackendInstance.PrivateIp}:5000
              ProxyPassReverse http://${BackendInstance.PrivateIp}:5000
          </Location>
          PROXYEOF
          
          systemctl enable httpd
          systemctl start httpd

  # Classic Load Balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    DependsOn: WebInstance
    Properties:
      LoadBalancerName: CF-CLB
      Subnets:
        - !Ref PublicSubnet
      SecurityGroups:
        - !Ref LBSG
      Instances:
        - !Ref WebInstance
      Listeners:
        - LoadBalancerPort: 80
          InstancePort: 80
          Protocol: HTTP
      HealthCheck:
        Target: HTTP:80/
        HealthyThreshold: 2
        UnhealthyThreshold: 5
        Interval: 30
        Timeout: 5

Outputs:
  LoadBalancerURL:
    Description: Application URL
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  
  JokeAPIURL:
    Description: Backend Joke API
    Value: !Sub 'http://${LoadBalancer.DNSName}/api/joke'
  
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
  
  NatGatewayId:
    Description: NAT Gateway ID
    Value: !Ref NatGateway
