AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Joke API - Serverless REST API with Lambda and API Gateway

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.11

Resources:
  # Lambda Function
  JokeApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: JokeApiFunction
      CodeUri: joke_api/
      Handler: app.lambda_handler
      Description: Returns programming jokes via REST API
      Events:
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: GET
            RestApiId: !Ref JokeApi
        JokeApi:
          Type: Api
          Properties:
            Path: /joke
            Method: GET
            RestApiId: !Ref JokeApi
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: GET
            RestApiId: !Ref JokeApi
      Tags:
        Application: JokeAPI
        Environment: Production

  # API Gateway
  JokeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: JokeAPI
      StageName: prod
      Description: Joke API Gateway
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowMethods: "'GET,OPTIONS'"

  # CloudWatch Log Group
  JokeApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${JokeApiFunction}'
      RetentionInDays: 7

Outputs:
  JokeApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${JokeApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
  
  JokeApiFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt JokeApiFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'
  
  JokeApiId:
    Description: API Gateway ID
    Value: !Ref JokeApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'
