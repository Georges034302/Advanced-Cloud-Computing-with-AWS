version: 0.0
os: linux

files:
  - source: /
    destination: /var/www/flask-app
    overwrite: true

permissions:
  - object: /var/www/flask-app
    owner: ec2-user
    group: ec2-user

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 30
      runas: root
  
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root
  
  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 60
      runas: root
  
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
      runas: root
